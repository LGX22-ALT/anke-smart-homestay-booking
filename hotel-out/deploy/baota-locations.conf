# Merge into the existing Baota site's server { } block.
# Keep Baota's listen, server_name, root and TLS certificate settings.
# Replace overlapping locations and disable Baota's generic image/JS cache
# regex locations, or /uploads could bypass the backend proxy.
# Backend must run directly on this host at 127.0.0.1:8081.

# Match Spring Boot's 50MB total request limit (individual images: 10MB).
client_max_body_size 50m;

location / {
    # Do not test directories: /attractions is both a Vue route and an image folder.
    try_files $uri /index.html;
}

# Revalidate the entry document after each deployment.
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Vite uses content hashes; missing assets must return 404, not index.html.
location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ^~ /api/ {
    # No URI suffix: preserve /api in the request sent to Spring Boot.
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_cache off;
}

location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}
