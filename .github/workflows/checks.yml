name: checks
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hotel-out/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: hotel-out
      - run: npm test && npm run lint && npm run build
        working-directory: hotel-out
      - run: bash mvnw test
        working-directory: hotel-back
        env:
          RUN_BROWSER_TESTS: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-evidence
          path: |
            hotel-out/test-results
            hotel-out/playwright-report
            hotel-back/target/surefire-reports
            .codex-artifacts/optimization-playwright.log
